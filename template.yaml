AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Civora - PWA serverless en AWS para reporte y seguimiento de incidentes comunitarios con detección explicable de duplicados

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - arm64
    CodeUri: dist/
    Environment:
      Variables:
        TABLE_NAME: !Ref IncidentsTable
        EVIDENCE_BUCKET_NAME: !Ref EvidenceBucket
        ALLOWED_ORIGIN: !Ref FrontendUrl

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  FrontendUrl:
    Type: String
    Description: URL de la PWA en Amplify, sin barra final (ej. https://main.xxxx.amplifyapp.com)
    AllowedPattern: '^https://[a-zA-Z0-9.-]+$'

Resources:
  # ==========================================
  # 1. DynamoDB: Tabla única CivoraIncidents
  # ==========================================
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'CivoraIncidents-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ==========================================
  # 2. S3: Bucket Privado de Evidencias
  # ==========================================
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'civora-evidence-${AWS::AccountId}-${AWS::Region}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, POST]
            AllowedOrigins:
              - 'http://localhost:5173'
              - !Ref FrontendUrl
            MaxAge: 3000

  # ==========================================
  # 3. Cognito: User Pool, Client y Grupos
  # ==========================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'civora-users-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'civora-pwa-client-${Environment}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - 'http://localhost:5173/'
        - !Sub '${FrontendUrl}/'
      LogoutURLs:
        - 'http://localhost:5173/'
        - !Sub '${FrontendUrl}/'

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'civora-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  ReporterGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: REPORTER
      UserPoolId: !Ref UserPool
      Description: Ciudadanos y vecinos reportantes

  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: MANAGER
      UserPoolId: !Ref UserPool
      Description: Gestores comunitarios y personal de atención

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      UserPoolId: !Ref UserPool
      Description: Administradores de la plataforma

  # ==========================================
  # 4. API Gateway: HTTP API con JWT Authorizer
  # ==========================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  # ==========================================
  # 5. Funciones Lambda
  # ==========================================
  PresignUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/presignUpload.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref EvidenceBucket
      Events:
        Presign:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /uploads/presign
            Method: POST
            Auth:
              Authorizer: NONE

  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/createIncident.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:civora-${Environment}-incident-processing'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !Sub 'civora-${Environment}-incident-processing'
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: POST
            Auth:
              Authorizer: NONE

  GetIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/getIncidents.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        ListIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: GET
            Auth:
              Authorizer: NONE
        ListMyIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/incidents
            Method: GET

  GetIncidentByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/getIncidentById.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - S3ReadPolicy:
            BucketName: !Ref EvidenceBucket
      Events:
        GetDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}
            Method: GET
            Auth:
              Authorizer: NONE

  UpdateStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/updateStatus.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        UpdateStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}/status
            Method: PATCH

  ConfirmIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/confirmIncident.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Confirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}/confirm
            Method: POST
            Auth:
              Authorizer: NONE

  LinkDuplicateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/linkDuplicate.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        LinkDup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}/link-duplicate
            Method: POST

  ProcessIncidentStepFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/processIncidentStep.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - S3ReadPolicy:
            BucketName: !Ref EvidenceBucket

  # ==========================================
  # 6. Step Functions: Orquestación Standard
  # ==========================================
  IncidentProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'civora-${Environment}-incident-processing'
      DefinitionUri: statemachine/incident.asl.json
      DefinitionSubstitutions:
        ProcessIncidentFunctionArn: !GetAtt ProcessIncidentStepFunction.Arn
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessIncidentStepFunction

Outputs:
  HttpApiUrl:
    Description: URL base de la HTTP API
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  CognitoDomain:
    Description: Dominio del Hosted UI de Cognito
    Value: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  UserPoolId:
    Description: ID del User Pool de Cognito
    Value: !Ref UserPool
  UserPoolClientId:
    Description: ID del App Client de Cognito
    Value: !Ref UserPoolClient
  EvidenceBucketName:
    Description: Bucket privado de evidencias fotográficas
    Value: !Ref EvidenceBucket